<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>成功率計算機</title>
<meta name="theme-color" content="#14171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成功率計算機">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2128;
    --panel-edge: #2a3038;
    --roulette: #c9a227;
    --pig: #e08a7a;
    --combo: #6fb3a8;
    --text: #eef0f2;
    --text-dim: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    padding: 24px 16px 60px;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 18px 18px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
  }
  .card.roulette::before { background: var(--roulette); }
  .card.pig::before { background: var(--pig); }
  .card.combo::before { background: var(--combo); }

  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card.roulette h2 { color: var(--roulette); }
  .card.pig h2 { color: var(--pig); }
  .card.combo h2 { color: var(--combo); }

  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 11px;
    color: var(--text-dim);
  }
  .field input {
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    padding: 10px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .card.roulette .field input:focus { border-color: var(--roulette); }
  .card.pig .field input:focus { border-color: var(--pig); }
  .card.combo .field input:focus { border-color: var(--combo); }

  .result {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-edge);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .result .label { font-size: 12px; color: var(--text-dim); }
  .result .value {
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .card.roulette .result .value { color: var(--roulette); }
  .card.pig .result .value { color: var(--pig); }
  .card.combo .result .value { color: var(--combo); }

  .combo-mode {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .combo-mode button {
    flex: 1 1 auto;
    min-width: calc(50% - 3px);
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    color: var(--text-dim);
    font-size: 12px;
    padding: 8px 6px;
    border-radius: 8px;
    cursor: pointer;
  }
  .combo-mode button.active {
    color: var(--bg);
    background: var(--combo);
    border-color: var(--combo);
    font-weight: 700;
  }

  .combo-note {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.5;
  }

  .combo-breakdown {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .combo-breakdown .mini {
    flex: 1;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .combo-breakdown .mini .mini-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .combo-breakdown .mini .mini-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .use-btn {
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .use-btn:hover { color: var(--text); }
  .sync-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  /* --- コピー枠 --- */
  .copy-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .copy-input {
    flex: 1;
    min-width: 0;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 10px;
    outline: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .copy-btn {
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--bg);
  }
  .card.roulette .copy-btn { background: var(--roulette); }
  .card.pig .copy-btn { background: var(--pig); }
  .card.combo .copy-btn { background: var(--combo); }
  .copy-btn:disabled {
    background: var(--panel-edge);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .copy-btn.copied { opacity: 0.65; }

  .combo-two {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-edge);
  }
  .combo-two-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .combo-all {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-edge);
  }
  .combo-all-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .combo-all-textarea {
    width: 100%;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 10px;
    line-height: 1.7;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  .combo-all-copy-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .save-btn {
    font-size: 12px;
    color: var(--bg);
    background: var(--text-dim);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 700;
  }
  .card.roulette .save-btn { background: var(--roulette); }
  .card.pig .save-btn { background: var(--pig); }
  .card.combo .save-btn { background: var(--combo); }
  .save-btn:disabled {
    background: var(--panel-edge);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .save-btn.saved { opacity: 0.6; }

  .history-toggle {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: 1px dashed var(--panel-edge);
    color: var(--text-dim);
    font-size: 12px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 4px;
  }

  .history-panel {
    margin-top: 14px;
    display: none;
  }
  .history-panel.open { display: block; }

  .history-item {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .history-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-item.roulette .dot { background: var(--roulette); }
  .history-item.pig .dot { background: var(--pig); }
  .history-item.combo .dot { background: var(--combo); }
  .history-item .info { flex: 1; min-width: 0; }
  .history-item .info .top {
    font-size: 13px;
    font-weight: 700;
  }
  .history-item .info .bottom {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .history-item .del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .history-empty {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 16px 0;
  }
  .history-clear {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    padding: 8px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Probability Tool</div>
    <h1>成功率計算機</h1>
  </header>

  <div class="card roulette">
    <h2>🎯 ルーレット成功率</h2>
    <div class="row">
      <div class="field">
        <label>成功回数</label>
        <input type="number" id="r-success" inputmode="numeric" min="0" placeholder="0">
      </div>
      <div class="field">
        <label>試行回数</label>
        <input type="number" id="r-total" inputmode="numeric" min="0" placeholder="0">
      </div>
    </div>
    <div class="result">
      <span class="label">成功率</span>
      <span class="value" id="r-result">—</span>
    </div>
    <div class="copy-row">
      <input type="text" class="copy-input" id="r-copy-text" readonly value="—">
      <button class="copy-btn" id="r-copy-btn" disabled>コピー</button>
    </div>
    <div class="save-row">
      <button class="save-btn" id="r-save" disabled>この結果を記憶する</button>
    </div>
  </div>

  <div class="card pig">
    <h2>🐷 豚成功率</h2>
    <div class="row">
      <div class="field">
        <label>成功回数</label>
        <input type="number" id="p-success" inputmode="numeric" min="0" placeholder="0">
      </div>
      <div class="field">
        <label>試行回数</label>
        <input type="number" id="p-total" inputmode="numeric" min="0" placeholder="0">
      </div>
    </div>
    <div class="result">
      <span class="label">成功率</span>
      <span class="value" id="p-result">—</span>
    </div>
    <div class="copy-row">
      <input type="text" class="copy-input" id="p-copy-text" readonly value="—">
      <button class="copy-btn" id="p-copy-btn" disabled>コピー</button>
    </div>
    <div class="save-row">
      <button class="save-btn" id="p-save" disabled>この結果を記憶する</button>
    </div>
  </div>

  <div class="card combo">
    <h2>➕ 合算成功率</h2>
    <div class="combo-mode">
      <button id="mode-pool" class="active">回数を合算</button>
      <button id="mode-either">どちらか成功</button>
      <button id="mode-both">両方成功</button>
      <button id="mode-avg">単純平均</button>
    </div>
    <div class="sync-row">
      <button class="use-btn" id="sync-btn">↑ 上の2項目の値を使う</button>
    </div>
    <div class="result">
      <span class="label" id="combo-label">合計成功回数 ÷ 合計試行回数</span>
      <span class="value" id="combo-result">—</span>
    </div>
    <div class="combo-breakdown" id="combo-breakdown" style="display:none;">
      <div class="mini">
        <div class="mini-label">合計成功回数</div>
        <div class="mini-value" id="combo-success">—</div>
      </div>
      <div class="mini">
        <div class="mini-label">合計試行回数</div>
        <div class="mini-value" id="combo-total">—</div>
      </div>
    </div>
    <div class="combo-note" id="combo-note"></div>
    <div class="copy-row">
      <input type="text" class="copy-input" id="c-copy-text" readonly value="—">
      <button class="copy-btn" id="c-copy-btn" disabled>コピー</button>
    </div>

    <div class="combo-two">
      <div class="combo-two-label">📋 ルーレット・豚 2種類まとめてコピペ</div>
      <textarea class="combo-all-textarea" id="two-copy-text" rows="2" readonly>—</textarea>
      <div class="combo-all-copy-row">
        <button class="copy-btn" id="two-copy-btn" disabled>2種類まとめてコピー</button>
      </div>
    </div>

    <div class="combo-all">
      <div class="combo-all-label">📋 ルーレット・豚・合算 まとめてコピペ</div>
      <textarea class="combo-all-textarea" id="all-copy-text" rows="3" readonly>—</textarea>
      <div class="combo-all-copy-row">
        <button class="copy-btn" id="all-copy-btn" disabled>3種類まとめてコピー</button>
      </div>
    </div>

    <div class="save-row">
      <button class="save-btn" id="c-save" disabled>この結果を記憶する</button>
    </div>
  </div>

  <button class="history-toggle" id="history-toggle">📜 記憶した結果を見る（0件）</button>
  <div class="history-panel" id="history-panel">
    <div id="history-list"></div>
    <button class="history-clear" id="history-clear" style="display:none;">すべて削除する</button>
  </div>
</div>

<script>
  const rSuccess = document.getElementById('r-success');
  const rTotal = document.getElementById('r-total');
  const rResult = document.getElementById('r-result');
  const rCopyText = document.getElementById('r-copy-text');
  const rCopyBtn = document.getElementById('r-copy-btn');

  const pSuccess = document.getElementById('p-success');
  const pTotal = document.getElementById('p-total');
  const pResult = document.getElementById('p-result');
  const pCopyText = document.getElementById('p-copy-text');
  const pCopyBtn = document.getElementById('p-copy-btn');

  const comboResult = document.getElementById('combo-result');
  const comboLabel = document.getElementById('combo-label');
  const comboNote = document.getElementById('combo-note');
  const comboBreakdown = document.getElementById('combo-breakdown');
  const comboSuccessEl = document.getElementById('combo-success');
  const comboTotalEl = document.getElementById('combo-total');
  const syncBtn = document.getElementById('sync-btn');
  const cCopyText = document.getElementById('c-copy-text');
  const cCopyBtn = document.getElementById('c-copy-btn');
  const twoCopyText = document.getElementById('two-copy-text');
  const twoCopyBtn = document.getElementById('two-copy-btn');
  const allCopyText = document.getElementById('all-copy-text');
  const allCopyBtn = document.getElementById('all-copy-btn');

  const modeButtons = {
    pool: document.getElementById('mode-pool'),
    either: document.getElementById('mode-either'),
    both: document.getElementById('mode-both'),
    avg: document.getElementById('mode-avg'),
  };
  let mode = 'pool';

  let rRate = null; // 0-1
  let pRate = null; // 0-1
  let comboValue = null; // 0-1
  let comboDetail = '';

  const rSaveBtn = document.getElementById('r-save');
  const pSaveBtn = document.getElementById('p-save');
  const cSaveBtn = document.getElementById('c-save');
  const historyToggle = document.getElementById('history-toggle');
  const historyPanel = document.getElementById('history-panel');
  const historyList = document.getElementById('history-list');
  const historyClear = document.getElementById('history-clear');

  const HIST_KEY = 'history';
  let historyData = [];
  let storageOk = true;

  async function loadHistory() {
    try {
      const res = await window.storage.get(HIST_KEY, false);
      historyData = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) {
      historyData = [];
    }
    renderHistory();
  }

  async function persistHistory() {
    try {
      const res = await window.storage.set(HIST_KEY, JSON.stringify(historyData), false);
      if (!res) storageOk = false;
    } catch (e) {
      storageOk = false;
    }
  }

  function renderHistory() {
    historyToggle.textContent = `📜 記憶した結果を見る（${historyData.length}件）`;
    if (historyData.length === 0) {
      historyList.innerHTML = '<div class="history-empty">まだ記憶した結果はありません。</div>';
      historyClear.style.display = 'none';
      return;
    }
    historyClear.style.display = 'block';
    historyList.innerHTML = historyData.map(item => `
      <div class="history-item ${item.type}">
        <div class="dot"></div>
        <div class="info">
          <div class="top">${item.label} — ${(item.value * 100).toFixed(2)}%</div>
          <div class="bottom">${item.detail} ・ ${item.ts}</div>
        </div>
        <button class="del" data-id="${item.id}">✕</button>
      </div>
    `).join('');
    historyList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => deleteRecord(btn.dataset.id));
    });
  }

  function nowStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function addRecord(type, label, value, detail) {
    const record = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      type, label, value, detail,
      ts: nowStr(),
    };
    historyData.unshift(record);
    renderHistory();
    await persistHistory();
    return record.id;
  }

  async function deleteRecord(id) {
    historyData = historyData.filter(item => item.id !== id);
    renderHistory();
    await persistHistory();
  }

  historyToggle.addEventListener('click', () => {
    historyPanel.classList.toggle('open');
  });

  historyClear.addEventListener('click', async () => {
    historyData = [];
    renderHistory();
    await persistHistory();
  });

  function flashSaved(btn) {
    const original = btn.textContent;
    btn.textContent = '✓ 記憶しました';
    btn.classList.add('saved');
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('saved');
      btn.disabled = false;
    }, 1200);
  }

  function openHistoryAndHighlight(id) {
    historyPanel.classList.add('open');
    requestAnimationFrame(() => {
      const el = historyList.querySelector(`[data-id="${id}"]`);
      if (el) el.closest('.history-item').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  rSaveBtn.addEventListener('click', async () => {
    if (rRate === null) return;
    const detail = `成功${rSuccess.value || 0} / 試行${rTotal.value || 0}`;
    const id = await addRecord('roulette', '🎯 ルーレット成功率', rRate, detail);
    flashSaved(rSaveBtn);
    openHistoryAndHighlight(id);
  });

  pSaveBtn.addEventListener('click', async () => {
    if (pRate === null) return;
    const detail = `成功${pSuccess.value || 0} / 試行${pTotal.value || 0}`;
    const id = await addRecord('pig', '🐷 豚成功率', pRate, detail);
    flashSaved(pSaveBtn);
    openHistoryAndHighlight(id);
  });

  cSaveBtn.addEventListener('click', async () => {
    if (comboValue === null) return;
    const id = await addRecord('combo', `➕ ${comboLabel.textContent}`, comboValue, comboDetail);
    flashSaved(cSaveBtn);
    openHistoryAndHighlight(id);
  });

  function calcRate(successEl, totalEl) {
    const s = parseFloat(successEl.value);
    const t = parseFloat(totalEl.value);
    if (isNaN(s) || isNaN(t) || t <= 0 || s < 0) return null;
    return Math.min(s / t, 1);
  }

  function fmt(rate) {
    if (rate === null) return '—';
    return (rate * 100).toFixed(2) + '%';
  }

  /* ---- 「〇〇回中〇〇通過〇〇%」表記の生成 ---- */
  function buildRouletteText() {
    const s = parseFloat(rSuccess.value);
    const t = parseFloat(rTotal.value);
    if (isNaN(s) || isNaN(t) || t <= 0 || s < 0) return null;
    const rate = Math.min(s / t, 1);
    return `ルレ${t}回中${s}回⭕️${(rate * 100).toFixed(2)}%`;
  }

  function buildPigText() {
    const s = parseFloat(pSuccess.value);
    const t = parseFloat(pTotal.value);
    if (isNaN(s) || isNaN(t) || t <= 0 || s < 0) return null;
    const rate = Math.min(s / t, 1);
    return `豚${t}回中${s}回⭕️${(rate * 100).toFixed(2)}%`;
  }

  function buildComboText() {
    if (mode === 'pool') {
      const rs = parseFloat(rSuccess.value);
      const rt = parseFloat(rTotal.value);
      const ps = parseFloat(pSuccess.value);
      const pt = parseFloat(pTotal.value);
      if ([rs, rt, ps, pt].some(v => isNaN(v) || v < 0)) return null;
      const totalTrials = rt + pt;
      const totalSuccess = rs + ps;
      if (totalTrials <= 0) return null;
      const rate = Math.min(totalSuccess / totalTrials, 1);
      return `${totalTrials}回中${totalSuccess}⭕️${(rate * 100).toFixed(2)}%`;
    }
    // 確率ベースのモードは「回数」が実在しないため％のみ表記
    if (comboValue === null) return null;
    return `${(comboValue * 100).toFixed(2)}%`;
  }

  /* ---- コピー処理（クリップボードAPI + フォールバック） ---- */
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  async function copyToClipboard(text) {
    if (!text) return false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through to fallback */ }
    fallbackCopy(text);
    return true;
  }

  function flashCopied(btn) {
    const original = btn.textContent;
    btn.textContent = '✓ コピー完了';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1200);
  }

  rCopyBtn.addEventListener('click', async () => {
    const text = rCopyText.dataset.text || '';
    if (!text) return;
    await copyToClipboard(text);
    flashCopied(rCopyBtn);
  });

  pCopyBtn.addEventListener('click', async () => {
    const text = pCopyText.dataset.text || '';
    if (!text) return;
    await copyToClipboard(text);
    flashCopied(pCopyBtn);
  });

  cCopyBtn.addEventListener('click', async () => {
    const text = cCopyText.dataset.text || '';
    if (!text) return;
    await copyToClipboard(text);
    flashCopied(cCopyBtn);
  });

  twoCopyBtn.addEventListener('click', async () => {
    const text = twoCopyText.dataset.text || '';
    if (!text) return;
    await copyToClipboard(text);
    flashCopied(twoCopyBtn);
  });

  allCopyBtn.addEventListener('click', async () => {
    const text = allCopyText.dataset.text || '';
    if (!text) return;
    await copyToClipboard(text);
    flashCopied(allCopyBtn);
  });

  function updateAllCopyText() {
    const rText = buildRouletteText();
    const pText = buildPigText();
    const cText = buildComboText();

    if (rText && pText) {
      const twoCombined = `${rText}\n${pText}`;
      twoCopyText.value = twoCombined;
      twoCopyText.dataset.text = twoCombined;
      twoCopyBtn.disabled = false;
    } else {
      twoCopyText.value = '—';
      twoCopyText.dataset.text = '';
      twoCopyBtn.disabled = true;
    }

    if (rText && pText && cText) {
      const combined = `${rText}\n${pText}\n合算：${cText}`;
      allCopyText.value = combined;
      allCopyText.dataset.text = combined;
      allCopyBtn.disabled = false;
    } else {
      allCopyText.value = '—';
      allCopyText.dataset.text = '';
      allCopyBtn.disabled = true;
    }
  }

  function updateRoulette() {
    rRate = calcRate(rSuccess, rTotal);
    rResult.textContent = fmt(rRate);
    rSaveBtn.disabled = rRate === null;

    const rText = buildRouletteText();
    rCopyText.value = rText || '—';
    rCopyText.dataset.text = rText || '';
    rCopyBtn.disabled = !rText;

    updateCombo();
  }

  function updatePig() {
    pRate = calcRate(pSuccess, pTotal);
    pResult.textContent = fmt(pRate);
    pSaveBtn.disabled = pRate === null;

    const pText = buildPigText();
    pCopyText.value = pText || '—';
    pCopyText.dataset.text = pText || '';
    pCopyBtn.disabled = !pText;

    updateCombo();
  }

  function updateCombo() {
    comboBreakdown.style.display = 'none';

    if (mode === 'pool') {
      const rs = parseFloat(rSuccess.value);
      const rt = parseFloat(rTotal.value);
      const ps = parseFloat(pSuccess.value);
      const pt = parseFloat(pTotal.value);
      const sOk = !isNaN(rs) && rs >= 0;
      const tOkR = !isNaN(rt) && rt >= 0;
      const sOkP = !isNaN(ps) && ps >= 0;
      const tOkP = !isNaN(pt) && pt >= 0;

      if (!(sOk && tOkR && sOkP && tOkP)) {
        comboResult.textContent = '—';
        comboLabel.textContent = '合計成功回数 ÷ 合計試行回数';
        comboNote.textContent = 'ルーレットと豚、両方の成功回数・試行回数を入力すると計算されます。';
        comboValue = null;
        cSaveBtn.disabled = true;
        cCopyText.value = '—';
        cCopyText.dataset.text = '';
        cCopyBtn.disabled = true;
        updateAllCopyText();
        return;
      }

      const totalSuccess = rs + ps;
      const totalTrials = rt + pt;

      if (totalTrials <= 0) {
        comboResult.textContent = '—';
        comboLabel.textContent = '合計成功回数 ÷ 合計試行回数';
        comboNote.textContent = '試行回数の合計が0のため計算できません。';
        comboValue = null;
        cSaveBtn.disabled = true;
        cCopyText.value = '—';
        cCopyText.dataset.text = '';
        cCopyBtn.disabled = true;
        updateAllCopyText();
        return;
      }

      const value = Math.min(totalSuccess / totalTrials, 1);
      comboLabel.textContent = '合計成功回数 ÷ 合計試行回数';
      comboNote.textContent = 'ルーレットと豚の成功回数・試行回数をそのまま合計して算出（独立事象の仮定なし）。';
      comboResult.textContent = fmt(value);
      comboBreakdown.style.display = 'flex';
      comboSuccessEl.textContent = `${totalSuccess}（${rs} + ${ps}）`;
      comboTotalEl.textContent = `${totalTrials}（${rt} + ${pt}）`;
      comboValue = value;
      comboDetail = `合計成功${totalSuccess}（ルーレット${rs}+豚${ps}） / 合計試行${totalTrials}（ルーレット${rt}+豚${pt}）`;
      cSaveBtn.disabled = false;

      const cText = buildComboText();
      cCopyText.value = cText || '—';
      cCopyText.dataset.text = cText || '';
      cCopyBtn.disabled = !cText;
      updateAllCopyText();
      return;
    }

    // 確率ベースのモード（どちらか成功 / 両方成功 / 単純平均）は
    // ルーレット・豚それぞれの成功率が必要
    if (rRate === null || pRate === null) {
      comboResult.textContent = '—';
      comboNote.textContent = 'ルーレット成功率と豚成功率の両方を入力すると計算されます。';
      comboValue = null;
      cSaveBtn.disabled = true;
      cCopyText.value = '—';
      cCopyText.dataset.text = '';
      cCopyBtn.disabled = true;
      updateAllCopyText();
      return;
    }

    let value;
    if (mode === 'either') {
      value = 1 - (1 - rRate) * (1 - pRate);
      comboLabel.textContent = '少なくとも一方が成功する確率';
      comboNote.textContent = '独立事象と仮定: 1 − (1−ルーレット)×(1−豚)';
    } else if (mode === 'both') {
      value = rRate * pRate;
      comboLabel.textContent = '両方とも成功する確率';
      comboNote.textContent = '独立事象と仮定: ルーレット × 豚';
    } else {
      value = (rRate + pRate) / 2;
      comboLabel.textContent = '単純平均成功率';
      comboNote.textContent = '(ルーレット + 豚) ÷ 2';
    }
    comboResult.textContent = fmt(value);
    comboValue = value;
    comboDetail = `ルーレット${fmt(rRate)} / 豚${fmt(pRate)}`;
    cSaveBtn.disabled = false;

    const cText = buildComboText();
    cCopyText.value = cText || '—';
    cCopyText.dataset.text = cText || '';
    cCopyBtn.disabled = !cText;
    updateAllCopyText();
  }

  function setMode(newMode) {
    mode = newMode;
    Object.entries(modeButtons).forEach(([key, btn]) => {
      btn.classList.toggle('active', key === newMode);
    });
    updateCombo();
  }

  modeButtons.pool.addEventListener('click', () => setMode('pool'));
  modeButtons.either.addEventListener('click', () => setMode('either'));
  modeButtons.both.addEventListener('click', () => setMode('both'));
  modeButtons.avg.addEventListener('click', () => setMode('avg'));

  syncBtn.addEventListener('click', () => {
    updateRoulette();
    updatePig();
  });

  [rSuccess, rTotal].forEach(el => el.addEventListener('input', updateRoulette));
  [pSuccess, pTotal].forEach(el => el.addEventListener('input', updatePig));

  updateCombo();
  loadHistory();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
