<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>九条組専用計算機</title>
<meta name="theme-color" content="#14171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="九条組専用計算機">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2128;
    --panel-edge: #2a3038;
    --roulette: #c9a227;
    --pig: #e08a7a;
    --combo: #6fb3a8;
    --text: #eef0f2;
    --text-dim: #8b93a1;
  }
  * { box-sizing: border-box; }
  html, body {
    touch-action: manipulation;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    padding: calc(24px + env(safe-area-inset-top))
             calc(16px + env(safe-area-inset-right))
             calc(60px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  .skip-link {
    position: fixed;
    left: 12px;
    top: 12px;
    z-index: 10;
    transform: translateY(-160%);
    background: var(--text);
    color: var(--bg);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .skip-link:focus { transform: translateY(0); }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  summary:focus-visible,
  a:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  header { margin-bottom: 28px; }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 18px 18px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
  }
  .card.roulette::before { background: var(--roulette); }
  .card.pig::before { background: var(--pig); }
  .card.combo::before { background: var(--combo); }

  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card.roulette h2 { color: var(--roulette); }
  .card.pig h2 { color: var(--pig); }
  .card.combo h2 { color: var(--combo); }

  .row {
    display: flex;
    gap: 26px;
    margin-bottom: 10px;
  }
  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: var(--text-dim);
  }
  .field input {
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    padding: 10px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .field input[aria-invalid="true"] { border-color: #ff8c8c; }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .card.roulette .field input:focus { border-color: var(--roulette); }
  .card.pig .field input:focus { border-color: var(--pig); }
  .card.combo .field input:focus { border-color: var(--combo); }

  .stepper-row {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .stepper-row input[type="number"] {
    flex: 1;
    min-width: 0;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 14px;
    padding: 8px 4px;
    min-height: 44px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  .stepper-row input[type="number"]::-webkit-outer-spin-button,
  .stepper-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 6px;
    background: #0f1216;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }
  .card.roulette .stepper-btn { border: 1px solid var(--roulette); color: var(--roulette); }
  .card.pig .stepper-btn { border: 1px solid var(--pig); color: var(--pig); }
  .stepper-btn:active { opacity: 0.6; }

  .settings-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .settings-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-label {
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .sound-options {
    display: flex;
    gap: 6px;
  }
  .sound-btn {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--text-dim);
    font-size: 11px;
    padding: 8px 12px;
    min-height: 44px;
    border-radius: 999px;
    cursor: pointer;
  }
  .sound-btn.active {
    background: var(--combo);
    border-color: var(--combo);
    color: var(--bg);
    font-weight: 700;
  }
  .mute-btn {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--text);
    font-size: 12px;
    padding: 8px 14px;
    min-height: 44px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    flex-shrink: 0;
  }
  .mute-btn.muted {
    background: #3a2426;
    border-color: #5a2f32;
    color: #e08a7a;
  }
  .settings-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .volume-control {
    position: relative;
    flex-shrink: 0;
  }
  .volume-control summary {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 74px;
    padding: 8px 12px;
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    background: var(--panel);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .volume-control summary::-webkit-details-marker { display: none; }
  .volume-control[open] summary {
    border-color: var(--combo);
    color: var(--combo);
  }
  .volume-popover {
    position: absolute;
    z-index: 8;
    top: calc(100% + 8px);
    right: 0;
    width: 220px;
    padding: 12px;
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    background: #0f1216;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
  }
  .volume-popover label {
    display: block;
    margin-bottom: 8px;
    color: var(--text-dim);
    font-size: 11px;
  }
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .volume-row input[type="range"] {
    width: 150px;
    accent-color: var(--combo);
    cursor: pointer;
  }
  .volume-row output {
    min-width: 38px;
    color: var(--text);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .result {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-edge);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .result .label { font-size: 12px; color: var(--text-dim); }
  .result .value {
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .card.roulette .result .value { color: var(--roulette); }
  .card.pig .result .value { color: var(--pig); }
  .card.combo .result .value { color: var(--combo); }

  .combo-mode {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .combo-mode button {
    flex: 1 1 auto;
    min-width: calc(50% - 3px);
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    color: var(--text-dim);
    font-size: 12px;
    padding: 10px 6px;
    min-height: 44px;
    border-radius: 8px;
    cursor: pointer;
  }
  .combo-mode button.active {
    color: var(--bg);
    background: var(--combo);
    border-color: var(--combo);
    font-weight: 700;
  }

  .combo-note {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.5;
  }

  .validation-message {
    min-height: 1.4em;
    margin-top: 8px;
    color: #ffadad;
    font-size: 12px;
    line-height: 1.4;
  }

  .combo-breakdown {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .combo-breakdown .mini {
    flex: 1;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .combo-breakdown .mini .mini-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .combo-breakdown .mini .mini-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* --- コピー枠 --- */
  .copy-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .copy-input {
    flex: 1;
    min-width: 0;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 10px;
    outline: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .copy-btn {
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--bg);
    min-height: 44px;
  }
  .card.roulette .copy-btn { background: var(--roulette); }
  .card.pig .copy-btn { background: var(--pig); }
  .card.combo .copy-btn { background: var(--combo); }
  .copy-btn:disabled {
    background: var(--panel-edge);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .copy-btn.copied { opacity: 0.65; }

  .combo-two {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-edge);
  }
  .combo-two-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .combo-all {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-edge);
  }
  .combo-all-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .combo-all-textarea {
    width: 100%;
    background: #0f1216;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 10px;
    line-height: 1.7;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  .combo-all-copy-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .save-btn {
    font-size: 12px;
    color: var(--bg);
    background: var(--text-dim);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 700;
    min-height: 44px;
  }
  .card.roulette .save-btn { background: var(--roulette); }
  .card.pig .save-btn { background: var(--pig); }
  .card.combo .save-btn { background: var(--combo); }
  .save-btn:disabled {
    background: var(--panel-edge);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .save-btn.saved { opacity: 0.6; }

  .history-toggle {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: 1px dashed var(--panel-edge);
    color: var(--text-dim);
    font-size: 12px;
    padding: 12px;
    min-height: 44px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 4px;
  }

  .history-panel {
    margin-top: 14px;
    display: none;
  }
  .history-panel.open { display: block; }

  .history-item {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .history-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-item.roulette .dot { background: var(--roulette); }
  .history-item.pig .dot { background: var(--pig); }
  .history-item.combo .dot { background: var(--combo); }
  .history-item .info { flex: 1; min-width: 0; }
  .history-item .info .top {
    font-size: 13px;
    font-weight: 700;
  }
  .history-item .info .bottom {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .history-item .del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .history-empty {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 16px 0;
  }
  .history-clear {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    padding: 10px;
    min-height: 44px;
    cursor: pointer;
    text-decoration: underline;
  }

  .reset-area {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--panel-edge);
  }
  .reset-toggle {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 10px 14px;
    border: 1px dashed #4b515b;
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
  }
  .reset-toggle:hover { color: var(--text); }
  .reset-toggle[aria-expanded="true"] {
    border-color: #8b4a4f;
    color: #ffadad;
  }
  .reset-confirm {
    margin-top: 10px;
    padding: 14px;
    border: 1px solid #5a2f32;
    border-radius: 12px;
    background: #24191b;
  }
  .reset-confirm[hidden] { display: none; }
  .reset-confirm p {
    margin: 0;
    color: var(--text);
    font-size: 12px;
    line-height: 1.6;
  }
  .reset-confirm .reset-note {
    display: block;
    margin-top: 4px;
    color: var(--text-dim);
    font-size: 11px;
  }
  .reset-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .reset-actions button {
    min-height: 44px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .reset-cancel {
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--text);
  }
  .reset-execute {
    border: 1px solid #8b4a4f;
    background: #4a2529;
    color: #ffd6d6;
  }
  .reset-execute:active { background: #6a3036; }

  .sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .status-message {
    position: fixed;
    left: 50%;
    top: calc(14px + env(safe-area-inset-top));
    z-index: 20;
    width: max-content;
    max-width: calc(100vw - 32px);
    transform: translate(-50%, -12px);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    background: #0f1216;
    color: var(--text);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.4;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
  }
  .status-message.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .status-message.anchored {
    transform: translate(-50%, calc(-100% - 8px));
  }
  .status-message.anchored.show {
    transform: translate(-50%, -100%);
  }

  @media (max-width: 360px) {
    .row { gap: 12px; }
    .card { padding-left: 14px; padding-right: 14px; }
    .sound-options { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">計算欄へ移動</a>
<div class="wrap">
  <header>
    <div class="eyebrow">Kujo-gumi Probability Tool</div>
    <h1>九条組専用計算機</h1>
  </header>

  <main id="main-content" tabindex="-1">
    <div class="settings-bar" aria-label="サウンド設定">
      <div class="settings-group">
        <span class="settings-label">タップ音</span>
        <div class="sound-options" role="group" aria-label="タップ音の種類">
          <button type="button" class="sound-btn active" data-sound="click" aria-pressed="true">ポチッ</button>
          <button type="button" class="sound-btn" data-sound="pop" aria-pressed="false">ポコッ</button>
          <button type="button" class="sound-btn" data-sound="chime" aria-pressed="false">ピコン</button>
          <button type="button" class="sound-btn" data-sound="theme" aria-pressed="false">テーマ</button>
        </div>
      </div>
      <div class="settings-actions">
        <button type="button" class="mute-btn" id="mute-toggle" aria-pressed="false" aria-label="効果音をオフにする">🔊 ON</button>
        <details class="volume-control" id="volume-control">
          <summary id="volume-summary" aria-label="音量を調節する">🎚 70%</summary>
          <div class="volume-popover">
            <label for="volume-slider">効果音の音量</label>
            <div class="volume-row">
              <input type="range" id="volume-slider" min="0" max="100" step="5" value="70" aria-describedby="volume-output">
              <output id="volume-output" for="volume-slider">70%</output>
            </div>
          </div>
        </details>
      </div>
    </div>

    <section class="card roulette" aria-labelledby="roulette-heading">
      <h2 id="roulette-heading">🎯 ルーレット成功率</h2>
      <div class="row">
        <div class="field">
          <label for="r-total">試行回数</label>
          <input type="number" id="r-total" inputmode="numeric" min="1" max="9007199254740991" step="1" placeholder="0" autocomplete="off" aria-describedby="r-error">
          <div class="stepper-row">
            <button type="button" class="stepper-btn" data-target="r-total" data-op="minus" aria-label="ルーレットの試行回数を減らす">−</button>
            <input type="number" id="r-total-delta" inputmode="numeric" min="1" max="9007199254740991" step="1" value="1" aria-label="ルーレットの試行回数の増減幅">
            <button type="button" class="stepper-btn" data-target="r-total" data-op="plus" aria-label="ルーレットの試行回数を増やす">＋</button>
          </div>
        </div>
        <div class="field">
          <label for="r-success">成功回数</label>
          <input type="number" id="r-success" inputmode="numeric" min="0" max="9007199254740991" step="1" placeholder="0" autocomplete="off" aria-describedby="r-error">
          <div class="stepper-row">
            <button type="button" class="stepper-btn" data-target="r-success" data-op="minus" aria-label="ルーレットの成功回数を減らす">−</button>
            <input type="number" id="r-success-delta" inputmode="numeric" min="1" max="9007199254740991" step="1" value="1" aria-label="ルーレットの成功回数の増減幅">
            <button type="button" class="stepper-btn" data-target="r-success" data-op="plus" aria-label="ルーレットの成功回数を増やす">＋</button>
          </div>
        </div>
      </div>
      <div class="validation-message" id="r-error" aria-live="polite"></div>
      <div class="result" role="status" aria-live="polite" aria-atomic="true">
        <span class="label">成功率</span>
        <span class="value" id="r-result">—</span>
      </div>
      <div class="copy-row">
        <input type="text" class="copy-input" id="r-copy-text" aria-label="ルーレット成功率のコピー用テキスト" readonly value="—">
        <button type="button" class="copy-btn" id="r-copy-btn" disabled>コピー</button>
      </div>
      <div class="save-row">
        <button type="button" class="save-btn" id="r-save" disabled>この結果を記憶する</button>
      </div>
    </section>

    <section class="card pig" aria-labelledby="pig-heading">
      <h2 id="pig-heading">🐷 豚成功率</h2>
      <div class="row">
        <div class="field">
          <label for="p-total">試行回数</label>
          <input type="number" id="p-total" inputmode="numeric" min="1" max="9007199254740991" step="1" placeholder="0" autocomplete="off" aria-describedby="p-error">
          <div class="stepper-row">
            <button type="button" class="stepper-btn" data-target="p-total" data-op="minus" aria-label="豚の試行回数を減らす">−</button>
            <input type="number" id="p-total-delta" inputmode="numeric" min="1" max="9007199254740991" step="1" value="1" aria-label="豚の試行回数の増減幅">
            <button type="button" class="stepper-btn" data-target="p-total" data-op="plus" aria-label="豚の試行回数を増やす">＋</button>
          </div>
        </div>
        <div class="field">
          <label for="p-success">成功回数</label>
          <input type="number" id="p-success" inputmode="numeric" min="0" max="9007199254740991" step="1" placeholder="0" autocomplete="off" aria-describedby="p-error">
          <div class="stepper-row">
            <button type="button" class="stepper-btn" data-target="p-success" data-op="minus" aria-label="豚の成功回数を減らす">−</button>
            <input type="number" id="p-success-delta" inputmode="numeric" min="1" max="9007199254740991" step="1" value="1" aria-label="豚の成功回数の増減幅">
            <button type="button" class="stepper-btn" data-target="p-success" data-op="plus" aria-label="豚の成功回数を増やす">＋</button>
          </div>
        </div>
      </div>
      <div class="validation-message" id="p-error" aria-live="polite"></div>
      <div class="result" role="status" aria-live="polite" aria-atomic="true">
        <span class="label">成功率</span>
        <span class="value" id="p-result">—</span>
      </div>
      <div class="copy-row">
        <input type="text" class="copy-input" id="p-copy-text" aria-label="豚成功率のコピー用テキスト" readonly value="—">
        <button type="button" class="copy-btn" id="p-copy-btn" disabled>コピー</button>
      </div>
      <div class="save-row">
        <button type="button" class="save-btn" id="p-save" disabled>この結果を記憶する</button>
      </div>
    </section>

    <section class="card combo" aria-labelledby="combo-heading">
      <h2 id="combo-heading">➕ 合算成功率</h2>
      <div class="combo-mode" role="group" aria-label="合算方法">
        <button type="button" id="mode-pool" class="active" aria-pressed="true">回数を合算</button>
        <button type="button" id="mode-either" aria-pressed="false">どちらか成功</button>
        <button type="button" id="mode-both" aria-pressed="false">両方成功</button>
        <button type="button" id="mode-avg" aria-pressed="false">単純平均</button>
      </div>
      <div class="result" role="status" aria-live="polite" aria-atomic="true">
        <span class="label" id="combo-label">合計成功回数 ÷ 合計試行回数</span>
        <span class="value" id="combo-result">—</span>
      </div>
      <div class="combo-breakdown" id="combo-breakdown" style="display:none;">
        <div class="mini">
          <div class="mini-label">合計成功回数</div>
          <div class="mini-value" id="combo-success">—</div>
        </div>
        <div class="mini">
          <div class="mini-label">合計試行回数</div>
          <div class="mini-value" id="combo-total">—</div>
        </div>
      </div>
      <div class="combo-note" id="combo-note"></div>
      <div class="copy-row">
        <input type="text" class="copy-input" id="c-copy-text" aria-label="合算成功率のコピー用テキスト" readonly value="—">
        <button type="button" class="copy-btn" id="c-copy-btn" disabled>コピー</button>
      </div>

      <div class="combo-two">
        <div class="combo-two-label">📋 ルーレット・豚 2種類まとめてコピペ</div>
        <textarea class="combo-all-textarea" id="two-copy-text" aria-label="ルーレットと豚のコピー用テキスト" rows="2" readonly>—</textarea>
        <div class="combo-all-copy-row">
          <button type="button" class="copy-btn" id="two-copy-btn" disabled>2種類まとめてコピー</button>
        </div>
      </div>

      <div class="combo-all">
        <div class="combo-all-label">📋 ルーレット・豚・合算 まとめてコピペ</div>
        <textarea class="combo-all-textarea" id="all-copy-text" aria-label="3種類のコピー用テキスト" rows="3" readonly>—</textarea>
        <div class="combo-all-copy-row">
          <button type="button" class="copy-btn" id="all-copy-btn" disabled>3種類まとめてコピー</button>
        </div>
      </div>

      <div class="save-row">
        <button type="button" class="save-btn" id="c-save" disabled>この結果を記憶する</button>
      </div>
    </section>

    <button type="button" class="history-toggle" id="history-toggle" aria-expanded="false" aria-controls="history-panel">📜 記憶した結果を見る（0件）</button>
    <div class="history-panel" id="history-panel" aria-label="記憶した結果">
      <div id="history-list"></div>
      <button type="button" class="history-clear" id="history-clear" style="display:none;">すべて削除する</button>
    </div>
    <div class="reset-area">
      <button type="button" class="reset-toggle" id="reset-toggle" aria-expanded="false" aria-controls="reset-confirm">↺ 数値を一括リセット</button>
      <div class="reset-confirm" id="reset-confirm" role="group" aria-labelledby="reset-confirm-title" hidden>
        <p id="reset-confirm-title">
          4つの入力数値をリセットしますか？
          <span class="reset-note">履歴・増減幅・音量設定は削除されません。8秒で自動的に閉じます。</span>
        </p>
        <div class="reset-actions">
          <button type="button" class="reset-cancel" id="reset-cancel">キャンセル</button>
          <button type="button" class="reset-execute" id="reset-execute">リセット実行</button>
        </div>
      </div>
    </div>
    <div id="status-message" class="status-message" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
</div>

<script src="./app.js" defer></script>
</body>
</html>
